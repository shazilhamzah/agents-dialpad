name: Publish to PyPI

# Opt-in: nothing is published until you (1) create the project on PyPI with a "trusted publisher" pointing at this
# repository and the workflow name "publish.yml", and (2) set the repository variable PUBLISH_TO_PYPI to "true".
on:
  release:
    types: [published]

jobs:
  publish:
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # trusted publishing: no API token is stored anywhere
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
