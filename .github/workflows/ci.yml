name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: uv sync
      - name: Python tests
        run: uv run pytest -q
      - name: Python compiles
        run: uv run python -m compileall -q gateway
      - name: Frontend syntax check
        run: node --check static/app.js && node --check static/markdown.js && node --check static/sw.js
      - name: Markdown renderer tests
        run: node --test tests/js/markdown.test.js
