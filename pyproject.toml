[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-dialpad"
version = "0.1.0"
description = "Chat with the AI coding CLIs on your computer (Claude Code, Antigravity) from your phone."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shazil Hamzah" }]
keywords = ["claude-code", "antigravity", "ai-agents", "pwa", "self-hosted", "tailscale"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "segno>=1.6.6",
    "uvicorn>=0.30",
]

[project.scripts]
agents-dialpad = "agents_dialpad.cli:main"

[project.urls]
Homepage = "https://github.com/shazilhamzah/agents-dialpad"
Issues = "https://github.com/shazilhamzah/agents-dialpad/issues"

[project.optional-dependencies]
push = [
    "pywebpush>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pywebpush>=2",
]

[tool.hatch.build.targets.wheel]
packages = ["agents_dialpad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
