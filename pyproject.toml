[project]
name = "agents-dialpad"
version = "0.1.0"
description = "Chat with the AI coding CLIs on your computer (Claude Code, Antigravity) from your phone."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shazil Hamzah" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/shazilhamzah/agents-dialpad"
Issues = "https://github.com/shazilhamzah/agents-dialpad/issues"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["gateway", "gateway.providers"]
